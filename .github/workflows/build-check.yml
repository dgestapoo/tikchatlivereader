name: Validate Python Project

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python syntax and dependency check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install TikTokLive==7.0.0 websockets==15.0.1

      - name: Compile Python files
        run: |
          python -m py_compile main.py

      - name: Verify required project files
        run: |
          test -f main.py
          test -f index.html
          test -f buildozer.spec
          test -f requirements.txt
          test -f icon.png

      - name: Validate Buildozer configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path("buildozer.spec").read_text(encoding="utf-8")

          required = [
              "[app]",
              "title = TikTok Live Reader",
              "package.name = tiktoklivereader",
              "source.include_exts",
              "requirements =",
              "android.permissions = INTERNET",
              "icon.filename = %(source.dir)s/icon.png",
          ]

          missing = [item for item in required if item not in spec]

          if missing:
              raise SystemExit(
                  "Missing Buildozer configuration entries:\n"
                  + "\n".join(f"- {item}" for item in missing)
              )

          print("Buildozer configuration looks valid.")
          PY
