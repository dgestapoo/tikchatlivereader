<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Reader</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 100%; margin: 0 auto; }
        input, button { width: 100%; padding: 14px; margin-top: 8px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 16px; }
        input { background: #222; color: #fff; border: 1px solid #444; }
        button { background: #fe2c55; color: #fff; font-weight: bold; cursor: pointer; }
        #chat-box { height: 60vh; overflow-y: auto; background: #1e1e1e; border-radius: 8px; padding: 10px; margin-top: 15px; border: 1px solid #333; }
        .msg { margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
        .user { color: #25f4ee; font-weight: bold; }
        .system { color: #ff0; font-style: italic; }
        .follow { color: #fe2c55; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="text-align: center; margin-top: 5px;">TikTok Reader APK</h3>
    <input type="text" id="username" placeholder="Masukkan Username (@user)">
    <button onclick="startReader()">Start</button>

    <div id="chat-box"></div>
</div>

<script>
    let ws;
    const synth = window.speechSynthesis;

    function connectWS() {
        ws = new WebSocket("ws://127.0.0.1:8765");
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = "msg";

            if (data.type === "chat") {
                msgDiv.innerHTML = `<span class="user">${data.user}:</span> ${data.message}`;
                speak(`${data.user} bilang, ${data.message}`);
            } else if (data.type === "follow") {
                msgDiv.innerHTML = `<span class="follow">[FOLLOW]</span> ${data.user} mengikuti!`;
                speak(`Terima kasih ${data.user} sudah mengikuti`);
            } else {
                msgDiv.innerHTML = `<span class="system">[SYSTEM] ${data.message}</span>`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        ws.onclose = () => setTimeout(connectWS, 2000);
    }

    function startReader() {
        const user = document.getElementById("username").value;
        if (user && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: "start", username: user }));
        }
    }

    function speak(text) {
        if (synth.speaking) synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "id-ID";
        utterance.rate = 1.1; 
        synth.speak(utterance);
    }

    window.onload = connectWS;
</script>

</body>
</html>
